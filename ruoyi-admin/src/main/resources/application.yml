# 项目相关配置
ruoyi:
  # 名称
  name: RuoYi
  # 版本
  version: 3.8.7
  # 版权年份
  copyrightYear: 2024
  # 文件路径 示例（ Windows配置C:/ruoyi/uploadPath，Linux配置 /home/ruoyi/uploadPath mac配置 /Users/deng/Desktop/asset/）
  #  服务器的地址
  #  profile: C:\win-x64\File\Images
  profile: /Users/deng/Desktop/asset

  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080,修改为9090
  port: 9090
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

# 企业微信配置（数据库 tob_wxwork_config 优先，此处为默认值兜底）
wxwork:
  # 应用主页地址，必须与企微后台「应用主页」一致，且域名在「可信域名」列表中
  app-home-url: https://zwfw.qjyc.cn/kd_api/wxwork/handle.html

# 调用python编写的模型服务参数配置
python:
  service:
    port: 5000
    startup-timeout: 30   # 等待启动超时（秒）
    command: "E:/minaconda/envs/ML/python.exe"
# 日志配置
logging:
  level:
    com.ruoyi: warn
    #    com.ruoyi: debug
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: druid
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 100MB
      # 设置总上传的文件大小
      max-request-size: 200MB
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true
  # redis 配置
  redis:
    # 地址
    host: localhost
    # 端口，默认为6379
    port: 6379
    # 数据库索引
    database: 0
    # 密码
    password: 123456
    # 连接超时时间
    timeout: 10s
    lettuce:
      pool:
        # 连接池中的最小空闲连接
        min-idle: 0
        # 连接池中的最大空闲连接
        max-idle: 8
        # 连接池的最大数据库连接数
        max-active: 8
        # #连接池最大阻塞等待时间（使用负值表示没有限制）
        max-wait: -1ms
  sms:
    account-id: "2c94811c946f6bfb0196a5a7bb756ac3"
    auth-token: "ba380d2a2dd74c3f86f37fbe69657927"
    app-id: "2c94811c946f6bfb0196a5a7bd1f6aca"
    template-id: "1"

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥
  secret: abcdefghijklmnopqrstuvwxyz
  # 令牌有效期（默认30分钟）
  expireTime: 30

# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.ruoyi.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Swagger配置
swagger:
  # 是否开启swagger
  enabled: true
  # 请求前缀
  pathMapping: /dev-api

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*


backup:
  # 备份文件存储路径
  dir: /Users/deng/Desktop/mysql_backups
  #  dir: C:/mysql_backups
  # 要备份的表名
  table: trafficdata
  # 数据库名
  database: cigarette
  # 数据库地址
  host: localhost
  # 端口
  port: 3306
  # 专用备份用户（权限最小化）
  username: backup_user
  #不填！使用 mysql_config_editor 加密
  password: StrongPas123!



